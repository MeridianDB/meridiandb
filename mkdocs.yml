site_name: MeridianDB
site_description: Exploring an embeddable temporal storage engine. Concepts, architecture and research decisions.
site_url: !ENV [DOCS_SITE_URL, 'https://meridiandb.org/']
repo_name: MeridianDB/meridiandb
repo_url: https://github.com/MeridianDB/meridiandb
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
use_directory_urls: true
copyright: Open source under the Apache License 2.0. Experimental project.

theme:
  name: material
  variant: classic
  language: en
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  font: false
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.action.edit
    - search.highlight

plugins:
  - search

markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Concepts:
      - Temporal data: concepts/temporal-data.md
  - Design:
      - Architecture: architecture/overview.md
      - Temporal contract: architecture/temporal-contract.md
      - Immutable storage research: architecture/storage-research.md
      - Journal format: architecture/journal-format.md
      - Immutable segment format: architecture/immutable-segment-format.md
      - Checkpoint manifest format: architecture/checkpoint-manifest-format.md
      - Decision records: decisions/index.md
      - Language strategy: decisions/0001-language-strategy.md
      - Documentation toolchain: decisions/0002-documentation-toolchain.md
      - Temporal semantics: decisions/0003-initial-temporal-semantics.md
      - Java build foundation: decisions/0004-java-build-foundation.md
      - Reference model: decisions/0005-reference-model.md
      - In-memory engine: decisions/0006-in-memory-engine.md
      - Journal format decision: decisions/0007-journal-format.md
      - Local journal decision: decisions/0008-local-journal.md
      - Immutable segment decision: decisions/0009-immutable-segment-format.md
      - Local segment decision: decisions/0010-local-segment-io.md
      - Manifest decision: decisions/0011-checkpoint-manifest-format.md
      - Local checkpoint decision: decisions/0012-local-checkpoint-publication.md
      - Local recovery decision: decisions/0013-local-database-recovery.md
      - Durable commit decision: decisions/0014-durable-commit-publication.md
      - Query operators decision: decisions/0015-temporal-query-operators.md
      - History compaction decision: decisions/0016-history-preserving-compaction.md
      - Reader protection decision: decisions/0017-live-reader-protection.md
  - Roadmap: roadmap.md
  - Contributing:
      - Working on MeridianDB: contributing/index.md
      - Java and Maven: development/build.md
      - Reference checks: development/reference-model.md
      - Embedded engine: development/embedded-engine.md
      - Temporal queries: development/temporal-queries.md
      - Local journal: development/local-journal.md
      - Local immutable segments: development/local-segments.md
      - Local checkpoints: development/local-checkpoints.md
      - Reader protection: development/reader-protection.md
      - History compaction: development/history-compaction.md
      - Local database: development/local-database.md
      - Durability conformance: development/durability-conformance.md
      - Documentation and publishing: contributing/documentation.md
