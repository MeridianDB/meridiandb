name: Documentation checks

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.in'
      - 'requirements-docs.txt'
      - '.python-version'
      - '.github/workflows/docs-*.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.in'
      - 'requirements-docs.txt'
      - '.python-version'
      - '.github/workflows/docs-*.yml'

permissions:
  contents: read

concurrency:
  group: docs-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        site-url: ['https://meridiandb.org/', 'https://meridiandb.github.io/meridiandb/']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: '.python-version'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-docs.txt
      - name: Build and check documentation links
        run: zensical build --strict --clean
        env:
          DOCS_SITE_URL: ${{ matrix.site-url }}
