name: Documentation checks

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.github/workflows/docs-*.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.github/workflows/docs-*.yml'

permissions:
  contents: read

concurrency:
  group: docs-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        base-path: ['/', '/meridiandb/']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build and check documentation links
        run: npm run docs:build
        env:
          DOCS_BASE_PATH: ${{ matrix.base-path }}
