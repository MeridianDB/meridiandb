name: Java checks

on:
  pull_request:
    paths:
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.java-version'
      - '.gitattributes'
      - 'src/**'
      - 'examples/**'
      - 'docs/architecture/fixtures/**'
      - 'docs/architecture/temporal-contract.md'
      - 'docs/architecture/journal-format.md'
      - 'docs/architecture/immutable-segment-format.md'
      - 'docs/architecture/checkpoint-manifest-format.md'
      - 'docs/development/local-journal.md'
      - 'docs/development/local-segments.md'
      - 'docs/development/local-checkpoints.md'
      - 'docs/development/local-database.md'
      - '.github/workflows/java-checks.yml'
  push:
    branches: [main]
    paths:
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.java-version'
      - '.gitattributes'
      - 'src/**'
      - 'examples/**'
      - 'docs/architecture/fixtures/**'
      - 'docs/architecture/temporal-contract.md'
      - 'docs/architecture/journal-format.md'
      - 'docs/architecture/immutable-segment-format.md'
      - 'docs/architecture/checkpoint-manifest-format.md'
      - 'docs/development/local-journal.md'
      - 'docs/development/local-segments.md'
      - 'docs/development/local-checkpoints.md'
      - 'docs/development/local-database.md'
      - '.github/workflows/java-checks.yml'

permissions:
  contents: read

concurrency:
  group: java-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            command: ./mvnw -B verify
          - os: windows-latest
            command: .\mvnw.cmd -B verify
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version
          check-latest: true
          cache: maven
          cache-dependency-path: pom.xml
      - name: Verify with the pinned Maven Wrapper
        run: ${{ matrix.command }}
      - name: Run the embedded Java example
        run: java --class-path target/classes examples/EmbeddedExample.java
      - name: Run the local journal example
        run: java --class-path target/classes examples/LocalJournalExample.java
      - name: Run the immutable segment example
        run: java --class-path target/classes examples/SegmentCodecExample.java
      - name: Run the local immutable segment example
        run: java --class-path target/classes examples/LocalSegmentExample.java
      - name: Run the manifest consistency example
        run: java --class-path target/classes examples/ManifestExample.java
      - name: Run the local checkpoint example
        run: java --class-path target/classes examples/LocalCheckpointExample.java
      - name: Run the local database recovery example
        run: java --class-path target/classes examples/LocalRecoveryExample.java
      - name: Run the writable local database example
        run: java --class-path target/classes examples/LocalDatabaseExample.java
      - name: Run the temporal query example
        run: java --class-path target/classes examples/QueryExample.java
      - name: Run the pure history compaction example
        run: java --class-path target/classes examples/CompactionExample.java
