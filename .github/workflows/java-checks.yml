name: Java checks

on:
  pull_request:
    paths:
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.java-version'
      - '.python-version'
      - '.gitattributes'
      - 'src/**'
      - 'adapters/**'
      - 'examples/**'
      - 'scripts/storage/**'
      - 'docs/architecture/fixtures/**'
      - 'docs/architecture/temporal-contract.md'
      - 'docs/architecture/journal-format.md'
      - 'docs/architecture/immutable-segment-format.md'
      - 'docs/architecture/checkpoint-manifest-format.md'
      - 'docs/development/local-journal.md'
      - 'docs/development/local-segments.md'
      - 'docs/development/local-checkpoints.md'
      - 'docs/development/local-database.md'
      - '.github/workflows/java-checks.yml'
  push:
    branches: [main]
    paths:
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.java-version'
      - '.python-version'
      - '.gitattributes'
      - 'src/**'
      - 'adapters/**'
      - 'examples/**'
      - 'scripts/storage/**'
      - 'docs/architecture/fixtures/**'
      - 'docs/architecture/temporal-contract.md'
      - 'docs/architecture/journal-format.md'
      - 'docs/architecture/immutable-segment-format.md'
      - 'docs/architecture/checkpoint-manifest-format.md'
      - 'docs/development/local-journal.md'
      - 'docs/development/local-segments.md'
      - 'docs/development/local-checkpoints.md'
      - 'docs/development/local-database.md'
      - '.github/workflows/java-checks.yml'

permissions:
  contents: read

concurrency:
  group: java-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            command: python scripts/storage/qualify_linux.py --scratch-parent "$RUNNER_TEMP" --label github-ubuntu-java25-local-v1
            adapter-command: ./mvnw -B -f adapters/s3/pom.xml verify
          - os: windows-latest
            command: .\mvnw.cmd -B install
            adapter-command: .\mvnw.cmd -B -f adapters/s3/pom.xml verify
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version
          check-latest: true
          cache: maven
          cache-dependency-path: |
            pom.xml
            adapters/s3/pom.xml
      - name: Set up Linux qualification tools
        if: runner.os == 'Linux'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: '.python-version'
      - name: Verify Linux qualification report guards
        if: runner.os == 'Linux'
        run: python -m unittest discover -s scripts/storage/tests -p 'test_*.py'
      - name: Verify with the pinned Maven Wrapper
        run: ${{ matrix.command }}
      - name: Retain Linux qualification evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-storage-evidence
          path: |
            ${{ runner.temp }}/mdb-linux-*/profile.json
            ${{ runner.temp }}/mdb-linux-*/java-profile.json
            ${{ runner.temp }}/mdb-linux-*/maven.log
            ${{ runner.temp }}/mdb-linux-*/reports/TEST-*.xml
          retention-days: 14
          if-no-files-found: warn
      - name: Verify the optional S3 adapter through loopback HTTP
        run: ${{ matrix.adapter-command }}
      - name: Run the embedded Java example
        run: java --class-path target/classes examples/EmbeddedExample.java
      - name: Run the local journal example
        run: java --class-path target/classes examples/LocalJournalExample.java
      - name: Run the immutable segment example
        run: java --class-path target/classes examples/SegmentCodecExample.java
      - name: Run the local immutable segment example
        run: java --class-path target/classes examples/LocalSegmentExample.java
      - name: Run the immutable object adapter example
        run: java --class-path target/classes examples/ObjectStoreExample.java
      - name: Run the manifest consistency example
        run: java --class-path target/classes examples/ManifestExample.java
      - name: Run the local checkpoint example
        run: java --class-path target/classes examples/LocalCheckpointExample.java
      - name: Run the local database recovery example
        run: java --class-path target/classes examples/LocalRecoveryExample.java
      - name: Run the writable local database example
        run: java --class-path target/classes examples/LocalDatabaseExample.java
      - name: Run the temporal query example
        run: java --class-path target/classes examples/QueryExample.java
      - name: Run the pure history compaction example
        run: java --class-path target/classes examples/CompactionExample.java
      - name: Run the local compaction publication example
        run: java --class-path target/classes examples/LocalCompactionExample.java
      - name: Run the reclamation inventory example
        run: java --class-path target/classes examples/ReclamationInventoryExample.java
      - name: Run the physical reclamation example
        run: java --class-path target/classes examples/ReclamationExample.java
